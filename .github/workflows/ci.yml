name: CI
on: [push, pull_request]

permissions:
  contents: read

jobs:
  test:
    name: ${{ matrix.os }} / Python ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.11", "3.14"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
      - name: Verify dependencies
        run: python -m pip check
      - name: Lint
        run: python -m ruff check .
      - name: Test
        run: python -m unittest discover -s tests -v
      - name: Compile
        run: python -m compileall -q src scripts tests
      - name: Build distributions
        run: python -m build
      - name: Verify distribution contents
        run: python scripts/verify_distribution.py
      - name: Build Windows demo package
        run: >-
          python scripts/build_demo_package.py
          --wheel dist
          --output build/Aiteqno-demo-ci.zip
          --release-tag ci
      - name: Verify Windows demo package
        run: >-
          python scripts/verify_demo_package.py
          build/Aiteqno-demo-ci.zip
          --release-tag ci
          --package-version 0.5.0.dev0

  real-runtime-baseline:
    name: Ubuntu 24.04 / real document OCR experiments
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      LC_ALL: C.UTF-8
      TZ: UTC
      AITEQNO_RUN_LIBREOFFICE_INTEGRATION: "1"
      AITEQNO_RUN_REAL_IMAGE_BASELINE: "1"
      AITEQNO_RUN_TESSERACT_INTEGRATION: "1"
      AITEQNO_REAL_BASELINE_OUTPUT: build/real-runtime-baseline
      AITEQNO_STAGE_OUTPUT: build/questionnaire-stage-1
      AITEQNO_STAGE_TWO_OUTPUT: build/questionnaire-stage-2
      AITEQNO_STAGE_THREE_OUTPUT: build/questionnaire-stage-3
      AITEQNO_STAGE_FOUR_OUTPUT: build/questionnaire-stage-4
      AITEQNO_STAGE_FIVE_OUTPUT: build/questionnaire-stage-5
      AITEQNO_STAGE_SIX_OUTPUT: build/questionnaire-stage-6
      AITEQNO_STAGE_SEVEN_OUTPUT: build/questionnaire-stage-7
      AITEQNO_TESSERACT_EXECUTABLE: /usr/bin/tesseract
      AITEQNO_TESSDATA_PREFIX: /usr/share/tesseract-ocr/5/tessdata
      AITEQNO_LIBREOFFICE_EXECUTABLE: /usr/bin/libreoffice
      AITEQNO_PDFTOPPM_EXECUTABLE: /usr/bin/pdftoppm
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - name: Install document runtimes
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            fonts-liberation2 \
            fonts-noto-cjk \
            libreoffice-writer \
            poppler-utils \
            tesseract-ocr \
            tesseract-ocr-jpn
          fc-cache -f
      - name: Record runtime availability
        run: |
          python -VV
          tesseract --version
          tesseract --list-langs
          libreoffice --version
          pdftoppm -v
          fc-match "Arial"
          fc-match "Noto Sans CJK JP"
          fc-match "Yu Gothic"
      - name: Install project
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
          python -m pip check
      - name: Run existing and baseline real-runtime integrations
        run: |
          python -m unittest -v \
            tests.test_ocr_backend.TesseractOcrBackendIntegrationTest \
            tests.test_png_extraction.TesseractPngExtractionIntegrationTest \
            tests.test_cli.RealCliRoundtripIntegrationTest \
            tests.test_golden_roundtrip.RealLibreOfficeGoldenIntegrationTest \
            tests.test_real_document_baseline.RealDocumentBaselineIntegrationTest
      - name: Run cumulative questionnaire Stage 1 gate
        run: >-
          python scripts/run_stage_suite.py
          --output "$AITEQNO_STAGE_OUTPUT"
          --expect-state pass
      - name: Run cumulative questionnaire Stage 2 gate
        run: >-
          python scripts/run_stage_suite.py
          --suite tests/fixtures/stages/questionnaire-stage-2.json
          --output "$AITEQNO_STAGE_TWO_OUTPUT"
          --expect-state pass
      - name: Run cumulative questionnaire Stage 3 gate
        run: >-
          python scripts/run_stage_suite.py
          --suite tests/fixtures/stages/questionnaire-stage-3.json
          --output "$AITEQNO_STAGE_THREE_OUTPUT"
          --expect-state pass
      - name: Run cumulative questionnaire Stage 4 gate
        run: >-
          python scripts/run_stage_suite.py
          --suite tests/fixtures/stages/questionnaire-stage-4.json
          --output "$AITEQNO_STAGE_FOUR_OUTPUT"
          --expect-state pass
      - name: Run cumulative questionnaire Stage 5 gate
        run: >-
          python scripts/run_stage_suite.py
          --suite tests/fixtures/stages/questionnaire-stage-5.json
          --output "$AITEQNO_STAGE_FIVE_OUTPUT"
          --expect-state pass
      - name: Run cumulative questionnaire Stage 6 gate
        run: >-
          python scripts/run_stage_suite.py
          --suite tests/fixtures/stages/questionnaire-stage-6.json
          --output "$AITEQNO_STAGE_SIX_OUTPUT"
          --expect-state pass
      - name: Run cumulative questionnaire Stage 7 gate
        run: >-
          python scripts/run_stage_suite.py
          --suite tests/fixtures/stages/questionnaire-stage-7.json
          --output "$AITEQNO_STAGE_SEVEN_OUTPUT"
          --expect-state pass
      - name: Upload baseline evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: real-runtime-baseline-${{ github.sha }}
          path: build/real-runtime-baseline
          if-no-files-found: warn
          retention-days: 14
      - name: Upload questionnaire Stage 1 evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: questionnaire-stage-1-${{ github.sha }}
          path: build/questionnaire-stage-1
          if-no-files-found: error
          retention-days: 14
      - name: Upload questionnaire Stage 2 evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: questionnaire-stage-2-${{ github.sha }}
          path: build/questionnaire-stage-2
          if-no-files-found: error
          retention-days: 14
      - name: Upload questionnaire Stage 3 evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: questionnaire-stage-3-${{ github.sha }}
          path: build/questionnaire-stage-3
          if-no-files-found: error
          retention-days: 14
      - name: Upload questionnaire Stage 4 evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: questionnaire-stage-4-${{ github.sha }}
          path: build/questionnaire-stage-4
          if-no-files-found: error
          retention-days: 14
      - name: Upload questionnaire Stage 5 evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: questionnaire-stage-5-${{ github.sha }}
          path: build/questionnaire-stage-5
          if-no-files-found: error
          retention-days: 14
      - name: Upload questionnaire Stage 6 evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: questionnaire-stage-6-${{ github.sha }}
          path: build/questionnaire-stage-6
          if-no-files-found: error
          retention-days: 14
      - name: Upload questionnaire Stage 7 evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: questionnaire-stage-7-${{ github.sha }}
          path: build/questionnaire-stage-7
          if-no-files-found: error
          retention-days: 14
