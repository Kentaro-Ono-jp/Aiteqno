name: CI
on: [push, pull_request]

permissions:
  contents: read

jobs:
  test:
    name: ${{ matrix.os }} / Python ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.11", "3.14"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install Linux document runtimes
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends libreoffice-writer tesseract-ocr tesseract-ocr-jpn
          tesseract --version
          tesseract --list-langs | grep -Fx eng
          tesseract --list-langs | grep -Fx jpn
          libreoffice --version
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
      - name: Verify dependencies
        run: python -m pip check
      - name: Lint
        run: python -m ruff check .
      - name: Test
        run: python -m unittest discover -s tests -v
        env:
          AITEQNO_RUN_LIBREOFFICE_INTEGRATION: ${{ runner.os == 'Linux' && '1' || '0' }}
          AITEQNO_RUN_TESSERACT_INTEGRATION: ${{ runner.os == 'Linux' && '1' || '0' }}
      - name: Compile
        run: python -m compileall -q src SchemaBridge scripts tests
      - name: Build distributions
        run: python -m build
      - name: Verify distribution contents
        run: python scripts/verify_distribution.py
